# Grimoire book configuration for the @deckyard/jsonschema documentation.

[book]
title = "@deckyard/jsonschema"
description = "Validate JSON values against JSON Schema (draft 2020-12)"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
# Any of the ten built-in themes; run "grimoire themes" for the list.
theme = "ivy"
# The colour mode a first-time reader gets: auto, light, or dark.
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-jsonschema/"
logo = "deckyard.svg"
favicon = "deckyard.svg"
repoUrl = "https://github.com/deckyard/deck-jsonschema"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-jsonschema/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
# The book is published as a site only.
enabled = false
